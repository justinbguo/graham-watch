name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push makes the first run's answer worthless, and both runs start a
# Supabase stack. Cancel the one nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # The nightly refresh's request plan. It has no dependencies; node:test
      # is the runner, same as operator/.
      - name: refresh planner
        run: >-
          node --test --experimental-strip-types
          scripts/refresh-run.test.mjs
          scripts/refresh-health.test.mjs
          scripts/deploy-functions.test.mjs
          scripts/drops-refresh.test.mjs
          scripts/dealer-filter.test.mjs
          scripts/deck-paging.test.mjs
          scripts/deck-stack.test.mjs
          scripts/deck-stage.test.mjs
          scripts/filter-spec.test.mjs
          scripts/listing-events.test.mjs
          scripts/rank.test.mjs
          scripts/repair-photos.test.mjs
          scripts/drops-select.test.ts
          scripts/feedback-contact.test.ts
          scripts/fixture-import.test.ts
          scripts/aggregator-pivot.test.mjs

      # Typecheck reads files; it does not resolve the route tree or the asset
      # graph. Deleting a screen that a navigator still registers, or importing
      # a font that is not installed, both pass tsc and fail on launch. Only a
      # bundle catches them.
      - name: bundle
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web"

  operator:
    name: operator ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: operator/package-lock.json

      # Its own package.json. Vite and Expo both want to own React and the
      # bundler, so they do not share a dependency tree. No root `npm ci` here:
      # the schema types it imports are a committed file, not a dependency.
      - run: npm ci
        working-directory: operator

      # Placeholders, but they have to be set. supabase.ts throws when the env
      # is missing, so with no values Rollup proves the throw always runs,
      # treats createClient as unreachable and tree-shakes every line of
      # supabase-js out. The build stays green while bundling an app that can
      # only crash — 228kB instead of 444kB.
      - name: build
        working-directory: operator
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

      - name: lint
        working-directory: operator
        run: npx oxlint --deny-warnings

      # No test runner dependency: Node 22 strips the types itself. The parser
      # under test decides which shops a pasted list adds, and its failure mode
      # is a line read as the wrong thing rather than a crash.
      - name: test
        working-directory: operator
        run: npm test

  functions:
    name: edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The only type check these get. They are not part of the Expo program,
      # so `npm run typecheck` never sees them, and the import pipeline is the
      # largest piece of untyped-in-CI code we ship.
      #
      # The config marks supabase/functions as the project root; see the note
      # inside it for why the app's package.json must stay out of scope.
      # --no-lock because a lockfile for the server files buys nothing: every
      # specifier is already version-pinned in the import itself.
      - name: typecheck
        run: >-
          deno check --no-lock --config supabase/functions/deno.ci.json
          supabase/functions/import-listings/index.ts
          supabase/functions/send-inquiry/index.ts
          supabase/functions/inquiry-draft/index.ts
          supabase/functions/claim-dealer/index.ts
          supabase/functions/verify-application/index.ts
          supabase/functions/notify-drops/index.ts
          supabase/functions/operator-bot/index.ts

      # Pure functions over a shop's feed: the shapes are real payloads a
      # dealer's site returned, which no other job here exercises.
      - name: test
        run: >-
          deno test --no-lock --config supabase/functions/deno.ci.json
          supabase/functions/

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Pinned, not `latest`. The types check below diffs generated output
      # against the committed file, so a CLI that formats differently turns a
      # Supabase release into a red build on an unrelated change. 2.100.1 and
      # 2.117.0 really do differ here, in the parentheses around the generic
      # helpers' constraints.
      #
      # Must equal devDependencies.supabase in package.json, which is what
      # `npm run db:types` uses locally. Bump both together and regenerate in
      # the same commit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - run: npm ci

      # Applies every migration in order against an empty database, which is
      # the only thing that proves a migration written today still works on a
      # machine that has never seen it.
      - name: start
        run: supabase start

      # RLS is the security boundary. The anon key ships inside the app binary,
      # so any rule these tests do not cover is a rule nobody is enforcing.
      - name: rls
        run: npm run test:rls

      # v2 search and v2 counts share listing_matches. This is the check that
      # they still agree with each other, with v1, and with matchesListing,
      # and that a keyset walk visits every row once.
      - name: filter contract
        run: npm run test:filters

      # The Buy page matches orderFeed, including the cursor and the rows a
      # guest is not allowed to see.
      - name: rank feed
        run: npm run test:rank

      - name: generated types match the schema
        run: |
          npm run db:types
          if ! git diff --quiet src/lib/database.types.ts; then
            echo "::error file=src/lib/database.types.ts::Stale. Run 'npm run db:types' and commit the result."
            git --no-pager diff src/lib/database.types.ts
            exit 1
          fi

  verify-drops:
    name: drops verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The harness shells out to the supabase binary in node_modules. Playwright
      # needs a browser. Both are local-only: the job never receives a hosted key.
      - name: install Chromium
        run: npx playwright install --with-deps chromium

      - name: prove drops
        run: npm run verify:drops
