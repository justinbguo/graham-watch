name: Catalogue refresh

# Keeps every approved shop current: re-read the catalogue, retire sold watches,
# auto-publish new and changed ones, then call notify-drops. Secrets live in
# the repo settings — the same trio as scripts/.env.operator.local, plus
# GRAHAM_CRON_SECRET which must also be set as a hosted edge-function secret
# (import-listings and notify-drops both read it). A failed notify-drops call
# fails this job. A night with nobody to notify stays green and prints why.

on:
  schedule:
    # 06:00 UTC daily. Vintage shops change slowly; once a day is enough and
    # keeps the OpenAI bill to changed prose only.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: refresh approved shops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # One request per shop, then short publish requests. A single request
      # that refreshed every shop exceeded the isolate's 2s CPU budget and
      # died HTTP 546 before printing anything. The loop attempts every shop.
      # The job goes red when any shop fails. A plain gateway 503 stays a
      # warning, unless every shop failed that way. A rejected request
      # (missing secret, bad key) goes red too.
      #
      # An empty catalogue, missing photos, or a week of nothing new is a
      # warning annotation. It does not fail this job.
      # notify-drops does: a non-2xx response, a delivery failure, or an
      # insert failure exits 1 after the catalogue write. Hosted functions
      # are updated by .github/workflows/deploy-functions.yml when they
      # change on main. A 404 here means that deploy has not shipped
      # notify-drops yet.
      - name: refresh
        env:
          GRAHAM_TARGET: hosted
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAHAM_CRON_SECRET: ${{ secrets.GRAHAM_CRON_SECRET }}
        run: npm run refresh
